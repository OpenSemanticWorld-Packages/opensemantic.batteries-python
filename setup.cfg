# This file is used to configure your project.
# Read more about the various options under:
# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
# https://setuptools.pypa.io/en/latest/references/keywords.html

[metadata]
name = opensemantic.batteries
description = Library with Python models derived from the page package world.opensemantic.batteries
author = OpenSemanticWorld
author_email = team@opensemantic.world
license = Apache 2.0
license_files = LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8; variant=GFM
url = https://github.com/OpenSemanticWorld-Packages/opensemantic.batteries-python
# Add here related links, for example:
project_urls =
    Documentation = https://github.com/OpenSemanticWorld-Packages/opensemantic.batteries-python
    Source = https://github.com/OpenSemanticWorld-Packages/opensemantic.batteries-python
#    Changelog = https://pyscaffold.org/en/latest/changelog.html
    Tracker = https://github.com/OpenSemanticWorld-Packages/opensemantic.batteries-python/issues
#    Conda-Forge = https://anaconda.org/conda-forge/pyscaffold
#    Download = https://pypi.org/project/PyScaffold/#files
#    Twitter = https://twitter.com/PyScaffold

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

# Require a min/specific Python version (comma-separated conditions)
python_requires = >=3.10

# Add here dependencies of your project (line-separated), e.g. requests>=2.2,<3.0.
# Version specifiers like >=2.2,<3.0 avoid problems due to API changes in
# new major versions. This works if the required packages follow Semantic Versioning.
# For more information, check out https://semver.org/.
install_requires =
    opensemantic.base>=0.42.8
    opensemantic.lab>=0.8.1
    opensemantic.characteristics.quantitative>=0.5.1.post1000004001002
    pydantic[email]

[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install opensemantic.batteries[controller]`
controller =
    opensemantic.lab[controller]

view =
    opensemantic.lab[view]
    opensemantic.base[view]

# Temporary git pin: the TestTime/StepTime duration-parsing fix
# (PR OpenBattTools/maccor-utility#4) is not yet released to PyPI. Repin to a
# released maccor-utility version once the PR is merged and published.
maccor =
    maccor-utility @ git+https://github.com/OpenBattTools/maccor-utility@9ee02bf2cae30f8cdb4b037277019c2ea4c8c391

# Docs / demo-media generation: Playwright drives the served dashboard and
# imageio stitches the captured frames into a GIF. After installing, run
# `playwright install chromium` once to fetch the browser.
docs =
    playwright
    imageio
    opensemantic.batteries[view,maccor]

# Add here test requirements (semicolon/line-separated)
testing =
    setuptools
    pytest
    pytest-cov
    opensemantic.batteries[maccor]

[options.entry_points]
# Add here console scripts like:
# console_scripts =
#     script_name = opensemantic.batteries.module:function

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
    --cov opensemantic.batteries --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
# markers =
#     slow: mark tests as slow (deselect with '-m "not slow"')
#     system: mark end-to-end system tests

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py
    src/opensemantic/batteries/_model.py #autogenerated
    src/opensemantic/batteries/v1/_model.py #autogenerated

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.6
package = batteries
extensions =
    github_actions
    markdown
    namespace
    no_skeleton
    pre_commit
namespace = opensemantic
